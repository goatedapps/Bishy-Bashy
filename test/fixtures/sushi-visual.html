<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sushi feedback check</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; padding:8px; background:#ffe350; }
  [hidden] { display:none !important; }
  .lanes { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; height:65dvh; margin-top:6px; }
  .lane { position:relative; min-width:0; }
</style>
<body class="is-playing sushi-switchboard-theme">
  <div class="sushi-menu sushi-shared-menu" id="menu"></div>
  <div class="lanes" id="lanes"></div>
  <script type="module">
    import '/src/workshop-games.css';
    import { WorkshopStage, SushiMenu } from '/src/workshop-view.js';
    import { createRun, roundSettings } from '/shared/games.js';
    const round = { id:'sushi-visual', game:'sushi-switchboard', ...roundSettings('sushi-switchboard', 123) };
    const stages = Array.from({ length:4 }, (_, index) => {
      const run = createRun(round, 0);
      const color = item => run.menu.findIndex(bucket => bucket.includes(item));
      run.tap(color(run.sequence[0][0]), 1000);
      if (index !== 0) {
        run.tap(color(run.sequence[1][0]), 2000);
        if (index === 2) run.tap((color(run.sequence[1][0]) + 1) % 3, 2200);
        if (index === 3) run.tap(color(run.sequence[1][1]), 2200);
      }
      const stage = new WorkshopStage();
      const lane = document.createElement('div');
      lane.className = 'lane'; lane.append(stage.element); document.getElementById('lanes').append(lane);
      return { run, stage };
    });
    new SushiMenu(document.getElementById('menu')).render(stages[0].run.menu);
    window.paint = (time = 2300, reduced = false) => stages.forEach(({ run, stage }) => {
      stage.motion = { matches:reduced };
      stage.render(round, run, time, time, true, true, run.cleared, run.done);
    });
    window.paint();
  </script>
</body>
